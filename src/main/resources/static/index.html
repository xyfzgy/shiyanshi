<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小食候 · AI 美食助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #eef4ff 0%, #f5f5f7 55%);
            color: #1d1d1f;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(255, 255, 255, .82);
            backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-bottom: 1px solid #e5e5e7;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: .3px;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
        }
        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .14); border-radius: 4px; }
        .msg {
            width: fit-content;
            max-width: min(70%, 640px);
            padding: 11px 15px;
            border-radius: 16px;
            line-height: 1.65;
            font-size: 14.5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: pop .22s ease-out;
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0a84ff, #0071e3);
            color: #fff;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 14px rgba(0, 122, 255, .28);
        }
        .ai {
            background: #fff;
            color: #1d1d1f;
            border: 1px solid rgba(0, 0, 0, .04);
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        }
        footer {
            padding: 14px 28px 18px;
            background: rgba(255, 255, 255, .86);
            backdrop-filter: blur(12px);
            border-top: 1px solid #e5e5e7;
            display: flex;
            gap: 10px;
        }
        #msg {
            flex: 1;
            padding: 12px 18px;
            background: #f2f2f5;
            border: 1px solid transparent;
            border-radius: 999px;
            font-size: 14.5px;
            color: #1d1d1f;
            outline: none;
            transition: background .18s, border-color .18s, box-shadow .18s;
        }
        #msg::placeholder { color: #86868b; }
        #msg:focus {
            background: #fff;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, .12);
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #0a84ff, #0071e3);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 14.5px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 122, 255, .3);
            transition: transform .15s, box-shadow .2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 122, 255, .38);
        }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled {
            background: #b0b0b5;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<header>🍳 小食候 · AI 美食助手</header>
<div id="chat"></div>
<footer>
    <input id="msg" placeholder="告诉我你有什么食材，或想吃什么口味..." autocomplete="off"/>
    <button id="send" onclick="send()">发送</button>
</footer>

<script>
    let conversationId = null;
    let sending = false;

    appendMsg('嗨，我是小食候～今天想吃点什么？说说你手边的食材也行，我们一起琢磨这顿吃什么。', 'ai');

    // 初始化：创建对话
    fetch('/api/chat/new', { method: 'POST' })
        .then(r => r.text())
        .then(id => { conversationId = id; })
        .catch(e => console.error('创建对话失败', e));

    function appendMsg(text, cls) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function send() {
        if (sending) return;
        const input = document.getElementById('msg');
        const text = input.value.trim();
        if (!text) return;

        sending = true;
        document.getElementById('send').disabled = true;
        input.value = '';
        appendMsg(text, 'user');

        const aiDiv = appendMsg('', 'ai');
        let buffer = '';

        const url = `/api/chat/stream?message=${encodeURIComponent(text)}&conversationId=${conversationId}`;
        const es = new EventSource(url);

        es.onmessage = (e) => {
            buffer += e.data;
            aiDiv.textContent = buffer;
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        };

        es.onerror = () => {
            es.close();
            sending = false;
            document.getElementById('send').disabled = false;
        };

        // 流结束时关闭（SSE 没有直接的 end 事件，靠 onerror 或服务端关闭）
        // 如果服务端正常关闭连接，onerror 也会触发，统一处理
    }

    // 回车发送
    document.getElementById('msg').addEventListener('keydown', e => {
        if (e.key === 'Enter') send();
    });
</script>
</body>
</html>
